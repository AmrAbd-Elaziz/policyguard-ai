config firewall policy
    edit 1
        set name "Lab-Allow-Internet"
        set srcintf "LAN"
        set dstintf "WAN"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set comments ""
    next

    edit 2
        set name "Lab-Admin-SSH"
        set srcintf "MGMT"
        set dstintf "SERVERS"
        set srcaddr "lab-admin-net"
        set dstaddr "lab-app-server"
        set action accept
        set schedule "always"
        set service "SSH"
        set logtraffic all
        set ips-sensor "lab-ips-profile"
        set comments "Approved lab administrative access"
    next

    edit 3
        set name "Lab-Legacy-Telnet"
        set srcintf "ADMIN"
        set dstintf "LEGACY"
        set srcaddr "lab-admin-net"
        set dstaddr "lab-legacy-server"
        set action accept
        set schedule "always"
        set service "TELNET"
        set logtraffic all
        set comments "Legacy lab application support"
    next

    edit 4
        set name "Lab-Test-To-Prod"
        set srcintf "TEST"
        set dstintf "PROD"
        set srcaddr "lab-test-net"
        set dstaddr "lab-prod-db"
        set action accept
        set schedule "always"
        set service "MSSQL"
        set logtraffic all
        set comments ""
    next

    edit 5
        set name "Lab-Default-Deny"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "Default deny policy"
    next
end